[project]
name = "assist"
version = "0.1.0"
description = "Assistant for IT specialists"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
